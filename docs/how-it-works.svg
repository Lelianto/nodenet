<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">How NodeNet works</title>
  <desc id="desc">Repository signals and LCDD governance are parsed into a unified local graph, then used to produce explainable change decisions and reviewer requirements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101c32"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .label{fill:#7dd3fc;font-size:15px;font-weight:700;letter-spacing:1.8px}.title{fill:#f8fafc;font-size:27px;font-weight:750}.body{fill:#cbd5e1;font-size:16px}.small{fill:#94a3b8;font-size:14px}.card{fill:#111d31;stroke:#334155;stroke-width:1.5}.chip{fill:#17243a;stroke:#334155}.flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="label">HOW NODENET WORKS</text>
  <text x="70" y="112" class="title">From repository signals to an explainable change decision</text>
  <text x="70" y="143" class="body">One deterministic graph connects code, context, ownership and authority — locally, without an LLM.</text>

  <path class="flow" d="M344 360H404"/><path class="flow" d="M682 360H742"/><path class="flow" d="M1020 360H1080"/>

  <g filter="url(#shadow)">
    <rect class="card" x="70" y="196" width="274" height="328" rx="22"/>
    <rect x="94" y="220" width="46" height="46" rx="13" fill="#0c4a6e"/><path d="M108 235h18m-18 8h18m-18 8h12" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <text x="94" y="300" class="label">01 · INPUTS</text><text x="94" y="336" class="title">Repository</text>
    <rect class="chip" x="94" y="366" width="226" height="42" rx="10"/><text x="110" y="392" class="body">Source · 10 languages</text>
    <rect class="chip" x="94" y="418" width="226" height="42" rx="10"/><text x="110" y="444" class="body">ADR · OpenAPI · SQL · IaC</text>
    <rect class="chip" x="94" y="470" width="226" height="42" rx="10"/><text x="110" y="496" class="body">Git diff · CODEOWNERS</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="404" y="196" width="278" height="328" rx="22"/>
    <rect x="428" y="220" width="46" height="46" rx="13" fill="#312e81"/><circle cx="451" cy="243" r="12" fill="none" stroke="#a5b4fc" stroke-width="3"/><circle cx="451" cy="243" r="3" fill="#a5b4fc"/>
    <text x="428" y="300" class="label">02 · LOCAL ENGINE</text><text x="428" y="336" class="title">Build the graph</text>
    <rect class="chip" x="428" y="366" width="230" height="42" rx="10"/><text x="444" y="392" class="body">Scan + fingerprint</text>
    <rect class="chip" x="428" y="418" width="230" height="42" rx="10"/><text x="444" y="444" class="body">Tiered parser adapters</text>
    <rect x="428" y="470" width="230" height="42" rx="10" fill="url(#accent)"/><text x="444" y="496" fill="#07111f" font-size="16" font-weight="750">Unified typed graph</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="742" y="196" width="278" height="328" rx="22"/>
    <rect x="766" y="220" width="46" height="46" rx="13" fill="#064e3b"/><path d="M779 244l8 8 13-17" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="766" y="300" class="label">03 · GOVERN CHANGE</text><text x="766" y="336" class="title">Resolve impact</text>
    <rect class="chip" x="766" y="366" width="230" height="42" rx="10"/><text x="782" y="392" class="body">Traverse affected nodes</text>
    <rect class="chip" x="766" y="418" width="230" height="42" rx="10"/><text x="782" y="444" class="body">Apply LCDD obligations</text>
    <rect class="chip" x="766" y="470" width="230" height="42" rx="10"/><text x="782" y="496" class="body">Preserve evidence paths</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1080" y="196" width="250" height="328" rx="22"/>
    <rect x="1104" y="220" width="46" height="46" rx="13" fill="#4c1d95"/><path d="M1117 244h20m-10-10v20" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <text x="1104" y="300" class="label">04 · DECISIONS</text><text x="1104" y="336" class="title">Act with proof</text>
    <rect class="chip" x="1104" y="366" width="202" height="42" rx="10"/><text x="1120" y="392" class="body">PASS · WARN · BLOCK</text>
    <rect class="chip" x="1104" y="418" width="202" height="42" rx="10"/><text x="1120" y="444" class="body">Required reviewers</text>
    <rect class="chip" x="1104" y="470" width="202" height="42" rx="10"/><text x="1120" y="496" class="body">CLI · CI · MCP · Map</text>
  </g>

  <g>
    <rect x="70" y="564" width="1260" height="126" rx="18" fill="#0b1728" stroke="#334155"/>
    <text x="94" y="600" class="label">LCDD 0.6 GOVERNANCE LAYER</text>
    <text x="94" y="634" class="body">Living context + lifecycle</text><circle cx="321" cy="628" r="4" fill="#38bdf8"/>
    <text x="345" y="634" class="body">Ownership + authority</text><circle cx="568" cy="628" r="4" fill="#818cf8"/>
    <text x="592" y="634" class="body">Approval obligations</text><circle cx="805" cy="628" r="4" fill="#34d399"/>
    <text x="829" y="634" class="body">Explainable evidence</text>
    <text x="94" y="666" class="small">Trust boundary: source and governance stay on your machine; identical inputs produce identical decisions.</text>
  </g>
</svg>
